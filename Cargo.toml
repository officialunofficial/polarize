[workspace]
resolver = "3"
members = ["crates/polarize-core", "crates/polarize-macos", "apps/polarize"]

[workspace.package]
version = "0.4.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/officialunofficial/polarize"
homepage = "https://github.com/officialunofficial/polarize"
rust-version = "1.96"
# `dist` (see dist-workspace.toml) distributes the built `polarize`
# binary through GitHub Releases, npm, and Homebrew — never through
# crates.io. `publish = false` is Cargo's own hard block against
# `cargo publish` for these crates, not just a release-plz setting.
# See docs/RELEASING.md.
publish = false

[profile.release]
lto = true
codegen-units = 1
strip = true

# For profiling with samply (`cargo build --profile profiling -p polarize`,
# then `samply record ./target/profiling/polarize`): same optimizations as
# release, but with full debug info for symbolication. Kept separate from
# `release` so the shipped binary isn't bloated with debug sections.
[profile.profiling]
inherits = "release"
debug = true
strip = false

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
