[package]
name = "polarize"
description = "polarize MCP server: a stdio Model Context Protocol server that automates real native macOS AppKit applications (screenshot, accessibility-tree inspection, synthetic input). Thin binary that wires MCP tool calls to polarize-core/polarize-macos."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
# No `publish = false` here, deliberately. This is the package that
# carries the whole workspace's git tag, GitHub Release, and changelog
# (release-plz.toml, git_only = true). release-plz drops any package
# Cargo reports as unpublishable before it asks anything else about it
# — confirmed live: with `publish = false` here, `release-plz release`
# printed "nothing to release" on every run, even with a real,
# unpublished v0.1.0 waiting to be tagged.
#
# This does not reopen a path to crates.io. Two different settings, two
# different jobs: this field decides whether release-plz handles the
# package at all; release-plz.toml's own `publish = false` (workspace
# default, not overridden for this package) decides whether it ever
# runs `cargo publish`. A manual `cargo publish` here would also fail
# on its own regardless — `polarize-core`/`polarize-macos` below each
# set `publish = false` themselves (via `publish.workspace = true`),
# Cargo's own hard block against publishing either one.

[[bin]]
name = "polarize"
path = "src/main.rs"

# Explicit, even though this package no longer sets `publish = false`
# (see above) and so would likely default to distributable anyway. This
# is the one binary `dist` (see dist-workspace.toml) should release,
# through GitHub, npm, and Homebrew — spelling that out here removes
# any doubt if the surrounding config changes again.
[package.metadata.dist]
dist = true

[dependencies]
# `version` here is required for `cargo package` to succeed, even
# though neither crate ever really publishes (see above) — `cargo
# package` refuses to package a manifest whose path dependencies carry
# no version requirement at all. release-plz runs `cargo package`
# internally to compute the next version, so this was blocking every
# release until added. Keep this in step with the workspace version;
# release-plz's own version-bump commits update it automatically.
polarize-core = { path = "../../crates/polarize-core", version = "0.1.0" }
polarize-macos = { path = "../../crates/polarize-macos", version = "0.1.0" }
# `rmcp`'s "macros" feature re-exports `rmcp-macros`'s `#[tool]`/
# `#[tool_router]`/`#[tool_handler]` attributes as `rmcp::{tool, ...}`.
# See `rmcp::lib`'s `pub use rmcp_macros::*`. A direct `rmcp-macros`
# dependency is unnecessary because of that re-export. Depending on it
# separately here resolved a second, version-mismatched copy of the
# proc-macro crate, alongside the one `rmcp` pulls in itself — see
# `Cargo.lock`'s single `rmcp-macros` entry after removing it.
rmcp = { version = "3.1.1", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
# "env-filter" reads `RUST_LOG`, matching every other `tracing` binary's
# convention. No other feature: `apps/polarize` writes plain text to
# stderr, never JSON or a file — see `main.rs`'s subscriber setup.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
