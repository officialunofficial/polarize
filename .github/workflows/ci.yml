name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # polarize-macos links real macOS frameworks (ScreenCaptureKit,
    # AppKit, ...), so this needs to run on a real macOS runner to even
    # compile.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Caches ~/.cargo/registry, ~/.cargo/git, and target/ between runs,
      # keyed on Cargo.lock's hash plus the rustc version and target
      # triple. sccache is not used here on purpose: it caches compiled
      # object code across repeated builds of the same crate under
      # different flags, which suits a cross-compilation matrix, not
      # this single-job workflow. rust-cache is the standard fit for
      # exactly this shape, and already carries its own workaround for
      # a known macOS cache-corruption issue (cargo#8603).
      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: cargo build
        run: cargo build --workspace

      # `apps/setup-helper` is a SwiftPM package, not a Cargo member —
      # `cargo build --workspace` above never touches it. This is its
      # only CI coverage today: it confirms the package still compiles
      # on every push. `macos-latest` ships Xcode, so `swift` is
      # already on PATH; no extra setup step is needed. `just
      # bundle-app` (which also builds and signs it into
      # `Polarize.app`) only runs where a signing identity exists —
      # see `build-notarized-app.yml`.
      - name: swift build (setup-helper)
        run: swift build -c release --package-path apps/setup-helper

      # `just check-quoting` dry-runs the signing recipes with a real
      # Developer ID identity string and parses each line with `sh -n`.
      # It executes nothing. See the recipe's own comment in `justfile`.
      - uses: extractions/setup-just@v3

      - name: just check-quoting
        run: just check-quoting
