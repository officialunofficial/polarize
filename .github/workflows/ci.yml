name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # polarize-macos links real macOS frameworks (ScreenCaptureKit,
    # AppKit, ...), so this needs to run on a real macOS runner to even
    # compile.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Caches ~/.cargo/registry, ~/.cargo/git, and target/ between runs,
      # keyed on Cargo.lock's hash plus the rustc version and target
      # triple. sccache is not used here on purpose: it caches compiled
      # object code across repeated builds of the same crate under
      # different flags, which suits a cross-compilation matrix, not
      # this single-job workflow. rust-cache is the standard fit for
      # exactly this shape, and already carries its own workaround for
      # a known macOS cache-corruption issue (cargo#8603).
      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: cargo build
        run: cargo build --workspace
