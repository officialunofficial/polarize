[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "npm", "homebrew"]
# The unscoped name "polarize" is already taken on the public npm
# registry (confirmed against registry.npmjs.org). Publish under the
# `unooo` npm org instead, the same way Argent publishes
# "@swmansion/argent" under its org.
npm-scope = "@unooo"
# Target platforms to build apps for (Rust target-triple syntax).
#
# macOS only. `polarize-macos` links real macOS frameworks
# (ScreenCaptureKit, AppKit, ...), so it cannot build for Linux or
# Windows. See README.md's "Workspace layout" section.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Whether to sign released macOS binaries with a Developer ID identity.
#
# Needs three GitHub Actions secrets: `CODESIGN_IDENTITY`,
# `CODESIGN_CERTIFICATE_PASSWORD`, `CODESIGN_CERTIFICATE` (see
# docs/RELEASING.md). Those are `dist`'s own secret names, read by its
# signing step. It skips signing gracefully when any one is absent, so
# turning this on before all three secrets exist just keeps releases
# ad-hoc-signed a while longer — it does not break the build.
macos-sign = true
# Attach a signed build-provenance attestation to every release artifact,
# via GitHub's native `actions/attest-build-provenance`. This proves an
# artifact really came from this repo's CI, not a tampered copy. It costs
# nothing extra to enable and needs no secrets of its own.
github-attestations = true
# Runs after `host` creates the GitHub Release. Assembles, signs, and
# notarizes `Polarize.app`, then uploads it as an extra release asset.
# `dist` has no built-in bundle or notarization support (see
# docs/RELEASING.md's "Notarization" section), so this job is
# hand-written, not generated. `dist generate --mode ci` wires it into
# `.github/workflows/release.yml` as
# `.github/workflows/build-notarized-app.yml` — that referenced file
# is the one to hand-edit; `release.yml` itself still is not.
#
# Both keys below are flat `[dist]`-level keys, and must stay above
# the `[dist.github-custom-runners]` table that follows. TOML assigns
# a bare `key = value` line to whichever table header came last, so a
# key placed after `[dist.github-custom-runners]` silently becomes
# part of that sub-table instead — confirmed live, the wrong placement
# parsed as a bogus runner-target entry with no error.
#
# `./publish-npm` replaces `dist`'s built-in `npm` publish job. The
# built-in job needs a long-lived `NPM_TOKEN`, which npm deprecated.
# The custom job uses trusted publishing (OIDC) instead. See
# docs/RELEASING.md's "npm publish" section.
publish-jobs = ["./publish-npm", "./build-notarized-app"]
[dist.github-custom-job-permissions.publish-npm]
id-token = "write"
contents = "read"
[dist.github-custom-job-permissions.build-notarized-app]
contents = "write"

# `dist`'s own runner auto-selection picked `macos-14`/`macos-15-intel` for
# these two targets. Both labels currently alias to the same underlying
# `macos-26-arm64` image as the `macos-26` label, but real builds still
# failed on them (see officialunofficial/polarize#18) while the same code
# compiles clean under a workflow pinned directly to `macos-26`. GitHub
# Actions runner labels can select a different default Xcode via
# `xcode-select` even on a shared image. Pinning `macos-26` explicitly
# tests that theory directly, instead of guessing at it.
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-26"
x86_64-apple-darwin = "macos-26"
