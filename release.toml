# cargo-release config.
#
# Cargo.toml's `version.workspace = true` means every crate in this
# workspace shares one version. `shared-version` bumps that one field
# instead of trying to version each crate on its own.
#
# `tag-name` picks the `v{version}` tag shape `dist-workspace.toml`
# expects. Pushing that tag triggers `.github/workflows/release.yml`
# (generated by `dist`) — see docs/RELEASING.md.
#
# `push = false`: this only bumps, commits, and tags locally. Push the
# tag yourself once you're satisfied with the result.
#
# `publish = false`: none of these three crates go to crates.io. `dist`
# distributes the built `polarize` binary through GitHub Releases, npm,
# and Homebrew instead. Every crate's own `Cargo.toml` also sets
# `publish = false` — a real Cargo-level block, not just this setting.
shared-version = true
consolidate-commits = true
tag-name = "v{{version}}"
push = false
publish = false
